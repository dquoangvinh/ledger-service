spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # The schema belongs to Flyway; Hibernate only checks that it matches the entities.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8091}

app:
  auth:
    # The token signer is this project's auth-service, not Keycloak. It publishes a JWKS and no
    # discovery document, and its issuer is a plain string rather than a URL - so the JWKS is named
    # directly here. See SecurityConfig for why spring.security.oauth2.resourceserver.jwt.issuer-uri
    # cannot be used for this issuer.
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/api/v1/auth/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:ecommerce-auth-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
