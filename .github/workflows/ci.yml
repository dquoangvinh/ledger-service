# Build and test on every push and pull request.
#
# Action majors are pinned to ones that run on node24. Node 20 is removed from
# GitHub-hosted runners on 2026-09-16, and actions still built on it stop working
# that day - upload-artifact@v5 is one of them, which is why this uses v7. Each
# tag's action.yml was read to check the runtime rather than assumed from the
# version number.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # The integration tests start PostgreSQL 18 through Testcontainers; the first
    # run also pulls the image. Generous, but a hung container should still fail
    # the run rather than sit there.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # No chmod +x here, deliberately. mvnw is committed with mode 100755 and
      # .gitattributes pins it to LF, so it arrives runnable. If that ever stops
      # being true this step is what says so, instead of a chmod hiding it.
      - name: Build and test
        run: ./mvnw -B verify

      # Docker Engine is preinstalled on ubuntu-latest, so Testcontainers needs
      # no setup step - only the reports do, and only when something failed.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
