# The ledger and what it needs to be usable: a database of its own, and something
# to issue the tokens it will not work without.
#
# auth-service is not part of this repository. It is built from the e-commerce
# project this ledger was extracted from, and its image has to be published
# before this file can stand anything up - see README, "Deploying the demo".
# Override AUTH_SERVICE_IMAGE to run against a locally built one.

name: ledger-demo

services:

  ledger-db:
    image: postgres:18-alpine
    # Measured idle at 41 MiB; 256m is room to grow, not a guess at the minimum.
    mem_limit: 256m
    environment:
      POSTGRES_DB: ledgerdb
      POSTGRES_USER: ${LEDGER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD}
    # PostgreSQL 18 moved PGDATA: mounting /var/lib/postgresql/data instead of the
    # parent leaves the real data directory inside the container, and every
    # `compose down` silently takes the database with it.
    volumes:
      - ledger-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEDGER_DB_USER:-postgres} -d ledgerdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-db:
    image: postgres:18-alpine
    # Measured idle at 56 MiB.
    mem_limit: 256m
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres} -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Only the token deny list uses this. auth-service catches the connection
  # failure and carries on, so losing Redis costs logout - a revoked token stays
  # usable until it expires on its own - and nothing else.
  redis:
    image: redis:8-alpine
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-ghcr.io/dquoangvinh/auth-service:latest}
    # 1g, not the 768m the ledger gets. Measured: at 768m this sits at 760 MiB -
    # 99% - one collection away from being killed, because its image runs ZGC,
    # whose native footprint is larger. At 1g it settles at 945 MiB and survives,
    # OOMKilled=false, no restarts. The figure stays high either way: with
    # MaxRAMPercentage the heap grows to fit whatever limit it is given, so a
    # container like this always looks nearly full and that on its own is not a
    # symptom.
    mem_limit: 1g
    environment:
      POSTGRES_HOST: auth-db
      POSTGRES_DB: authdb
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD}
      REDIS_HOST: redis
      AUTH_JWT_ISSUER: ecommerce-auth-service
      # A throwaway RSA pair generated at startup, so no private key has to live
      # in this file or in the deployment's environment. The cost is real and
      # bounded: every restart invalidates every token that was issued, and a
      # second replica would reject the first one's. Fine for one demo instance,
      # wrong for anything else - set AUTH_JWT_PRIVATE_KEY/PUBLIC_KEY instead.
      AUTH_JWT_ALLOW_EPHEMERAL_KEY: "true"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ledger-service:
    image: ${LEDGER_SERVICE_IMAGE:-ghcr.io/dquoangvinh/ledger-service:latest}
    # Measured healthy in 18s at this limit, using 293 MiB of it. The JVM read
    # the limit rather than the host: MaxHeapSize came out at 576 MB, exactly 75%
    # of 768m. That is the whole reason these limits exist - without one, each JVM
    # sizes its heap against the host's memory, so two of them on an 8 GB box
    # would between them claim 12 GB and neither would survive the discovery.
    mem_limit: 768m
    environment:
      DB_HOST: ledger-db
      DB_NAME: ledgerdb
      DB_USERNAME: ${LEDGER_DB_USER:-postgres}
      DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD}
      # Inside the network, by service name. The issuer is a plain string and is
      # compared for equality, so it must match what auth-service stamps into the
      # token exactly - it is not a URL and nothing dereferences it.
      JWT_JWK_SET_URI: http://auth-service:8090/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ecommerce-auth-service
    ports:
      - "${LEDGER_PORT:-8091}:8091"
    depends_on:
      ledger-db:
        condition: service_healthy
      # started, not healthy: the ledger fetches the JWKS lazily, on the first
      # token it has to verify, so it does not need auth-service up to boot. This
      # keeps a slow auth-service from holding the whole stack down.
      auth-service:
        condition: service_started
    restart: unless-stopped

volumes:
  ledger-db-data:
  auth-db-data:
